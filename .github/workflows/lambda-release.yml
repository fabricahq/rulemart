name: Lambda release artifacts
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: lambda-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Build on the Lambdas' own CPU architecture; no cross-compiled smoke tests.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    # Integration tests create their own databases on this server.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RULEMART_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The sqlc queries, templ components, and stylesheet are committed; fail when they don't match their sources.
      - run: make check-generated
      # The Code Rules files must match .code-rules/config.yaml and the imported releases. The version and checksum
      # are pinned; raise both together.
      - name: Check the Code Rules files
        env:
          CODE_RULES_VERSION: 0.2.0
          CODE_RULES_SHA256: a38be1da2b6d8d9bd8938136d1a397fdc8ced81c236b248ba7c495e92c9d6882
        run: |
          archive="code-rules_${CODE_RULES_VERSION}_linux_arm64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/fabricahq/code-rules/releases/download/v${CODE_RULES_VERSION}/$archive"
          echo "$CODE_RULES_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" code-rules
          "$RUNNER_TEMP/code-rules" project check
      - run: make check
      - name: Package and verify reproducibility
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/package-release.py --commit "$SOURCE_COMMIT" --output build/release
          python3 scripts/package-release.py --commit "$SOURCE_COMMIT" --output build/repeat
          for zip in build/release/*.zip; do cmp "$zip" "build/repeat/$(basename "$zip")"; done
          for zip in build/release/*.zip; do
            unpacked="build/unpacked/$(basename "$zip" .zip)"
            mkdir -p "$unpacked"
            unzip -q -o "$zip" bootstrap -d "$unpacked"
            file "$unpacked/bootstrap" | grep -q 'ELF 64-bit LSB executable, ARM aarch64'
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-release
          path: build/release/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # A fresh runner gets only data artifacts. It never checks out or runs application code.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-release
          path: release
      - name: Publish an immutable version's assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Release only commits already merged into main.
          status=$(gh api "repos/$GH_REPO/compare/$SOURCE_COMMIT...main" --jq .status)
          [[ "$status" == identical || "$status" == ahead ]]
          cd release
          jq -e --arg sha "$SOURCE_COMMIT" '.source_commit == $sha and .runtime == "provided.al2023" and .architecture == "arm64"' manifest.json
          jq -r '.assets[] | "\(.sha256)  \(.asset)"' manifest.json | sha256sum --check --strict
          notes="Lambdas for provided.al2023 / arm64. Source: $SOURCE_COMMIT. $(jq -r '[.assets[] | "\(.asset) SHA-256: \(.sha256)"] | join(". ")' manifest.json). No infrastructure deployment."
          # No --clobber: existing releases are never silently replaced.
          gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS manifest.json --verify-tag --title "$RELEASE_TAG" --notes "$notes"
