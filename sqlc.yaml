# sqlc generates typed Go for the catalog's queries against the schema in db/migrations. Run make generate after
# changing a query or the schema.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: internal/contexts/catalog/store/postgres/queries
    gen:
      go:
        package: catalogdb
        out: internal/contexts/catalog/store/postgres/catalogdb
        sql_package: pgx/v5
