# sqlc generates typed Go for each bounded context's queries against the schema in db/migrations, into a generated/
# package beside the context's store, with every file named *.generated.go. Run make generate after changing a query
# or the schema.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: internal/contexts/catalog/store/postgres/queries
    gen:
      go:
        package: catalogdb
        out: internal/contexts/catalog/store/postgres/generated/catalogdb
        sql_package: pgx/v5
        output_db_file_name: db.generated.go
        output_models_file_name: models.generated.go
        output_files_suffix: .generated
  - engine: postgresql
    schema: db/migrations
    queries: internal/contexts/accounts/store/postgres/queries
    gen:
      go:
        package: accountsdb
        out: internal/contexts/accounts/store/postgres/generated/accountsdb
        sql_package: pgx/v5
        output_db_file_name: db.generated.go
        output_models_file_name: models.generated.go
        output_files_suffix: .generated
