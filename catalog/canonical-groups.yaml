# Canonical Code Rules group IDs.
#
# Libraries choose their own group IDs. When libraries use an ID from this list,
# tools and catalogs can treat their groups as the same group and combine them.
# A group whose ID isn't listed stands alone. The list has no aliases.
#
# Each entry maps a group ID to its display name and one line saying which rules
# belong in the group. Keep entries sorted by ID. Unknown fields are errors.
# Tools should read this file at an explicit commit and update that pin
# deliberately. To propose a group, open a pull request. See
# https://code-rules.fabricahq.com/concepts/groups/#canonical-group-ids
practices/accessibility:
  name: Accessibility
  description: Making interfaces usable with assistive technology, keyboards, and varied vision, hearing, and motor abilities.
practices/api-design:
  name: API design
  description: The contracts of HTTP, RPC, and library APIs, including resources, errors, pagination, versioning, and compatibility.
practices/code-design:
  name: Code design
  description: How functions, modules, and folders are structured so code reads clearly and each feature's code stays together; naming has its own group.
practices/code-review:
  name: Code review
  description: How to review changes and plans, including agent-written pull requests.
practices/comments:
  name: Comments
  description: Code comments, file headers, and doc comments.
practices/concurrency:
  name: Concurrency
  description: Coordinating concurrent work, including shared resources, parallel tasks, and propagating cancellation between them.
practices/database-migrations:
  name: Database migrations
  description: Changing schemas and data safely, with backward compatibility, expand-and-contract steps, and reversibility, whatever the tool.
practices/dependency-management:
  name: Dependency management
  description: Choosing, pinning, and updating third-party dependencies; responding to vulnerable dependencies belongs in security.
practices/documentation:
  name: Documentation
  description: Guides, references, and other written documentation; READMEs and code comments have their own groups.
practices/error-handling:
  name: Error handling
  description: Creating, wrapping, returning, and reporting errors.
practices/naming:
  name: Naming
  description: Names for variables, functions, types, files, and other identifiers; how code is structured belongs in code design.
practices/observability:
  name: Observability
  description: Logs, metrics, and traces.
practices/performance:
  name: Performance
  description: Speed and resource use, guided by measurement and without changing behavior.
practices/readmes:
  name: READMEs
  description: Repository READMEs, from what the product does to a first working result and links to the full documentation.
practices/resilience:
  name: Resilience
  description: Timeouts, retries, and recovery from failures in networks, services, and other external operations.
practices/security:
  name: Security
  description: Protecting code and data from attack, including authentication, authorization, secrets, input handling, and vulnerable dependencies.
practices/testing:
  name: Testing
  description: What to test and how to write, name, and run tests, regardless of language or framework.
practices/version-control:
  name: Version control
  description: Commits, branches, and pull requests.
