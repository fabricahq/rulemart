  <rect x="222" y="158" width="236" height="24" rx="12" fill="#ffffff"/>
  <text x="340" y="175" font-size="12.5" fill="#5b616b" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif">Revert the change: the test fails again</text>
